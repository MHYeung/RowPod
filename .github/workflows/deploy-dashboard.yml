# Deploy web/ble_plotter → GitHub Pages on this private repo (GitHub Pro).
# Repo Settings → Pages → Source: GitHub Actions
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "web/ble_plotter/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages ignores Jekyll
        run: touch web/ble_plotter/.nojekyll

      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/ble_plotter

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
